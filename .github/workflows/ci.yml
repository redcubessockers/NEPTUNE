name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Parse the opt-in R52 native safety gate with Windows PowerShell 5.1.
      # R52 fixtures are not in the public source: parsing is not execution.
      - name: R52 safety runner syntax (PowerShell 5.1)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('tests/r52-unwind-gate.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
      # The panicking worker test owns process-global state. Run it alone.
      - name: Heap worker panic join (isolated)
        run: cargo test -p victory-gpu --locked heap_worker::tests::neptune_worker_join_failure_remains_failure -- --ignored --exact --nocapture --test-threads=1
      # R74: execute the native PDH lifetime tests that are intentionally
      # ignored by default. The Windows runner owns these short-lived queries.
      - name: R74 PDH query lifecycle on native Windows
        run: cargo test -p victory-gpu --lib --locked stats::tests::pdh_query_is_closed_when_ -- --ignored --nocapture --test-threads=1
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked --exclude victory-gpu
      # The runner has no card, so these tests make their devices on Microsoft's software
      # renderer, whose shader compiler has crashed the test program (access violation in
      # d3d10warp) when several tests used it at once. One test at a time has not shown it.
      - name: Tests, victory-gpu (one at a time)
        run: cargo test -p victory-gpu --locked -- --test-threads=1
